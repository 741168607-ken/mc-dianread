<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system}
body{max-width:1080px;margin:16px auto;padding:0 14px;background:#f4f7fb;}
.header-card{background:#fff;padding:18px 22px;border-radius:14px;box-shadow:0 1px 8px #00000012;margin-bottom:14px;}
.ctrl-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.tab-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.tab-btn{padding:8px 14px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;}
.tab-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;}
.voice-btn{padding:8px 16px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;font-weight:600;}
.voice-btn.active{background:#16a34a;color:#fff;border-color:#16a34a;}
.sentence-item{padding:12px 14px;border-bottom:1px solid #e8edf3;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;}
.sentence-item:hover{background:#edf2fc;}
.sentence-item.playing{background:#cce0ff;}
.sentence-item.playing .spk{animation:pulse 0.8s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.spk{font-size:22px;flex-shrink:0;}
.en-line{font-size:19px;color:#0f172a;margin-bottom:4px;}
.cn-line{font-size:16px;color:#555864;}
.info-note{font-size:13px;color:#64748b;margin:6px 0;}
button,select{padding:7px 12px;font-size:14px;border-radius:7px;border:1px solid #cbd5e1;cursor:pointer;}
input[type=range]{width:130px;}
#listWrap{background:#ffffff;border-radius:12px;box-shadow:0 1px 10px #00000014;max-height:70vh;overflow-y:auto;}
</style>
</head>
<body>
<div class="header-card">
<h2>🎮 Minecraft英语点读｜真人发音版</h2>
<div class="info-note">✅ 微软神经网络真人发音，预生成离线播放 · 点击句子即可朗读</div>

<div class="tab-row">
<button class="tab-btn active" data-type="all">全部句子</button>
<button class="tab-btn" data-type="daily">📝日常简单用语</button>
<button class="tab-btn" data-type="gameBasic">🎮游戏基础会话</button>
<button class="tab-btn" data-type="gameAdv">⚒高阶探险红石</button>
</div>

<div class="ctrl-row">
<label>发音人：</label>
<button class="voice-btn active" data-voice="aria">👩 Aria 老师（自然女声）</button>
<button class="voice-btn" data-voice="ana">🧒 Ana（小朋友声音）</button>
</div>

<div class="ctrl-row">
<label>语速：</label>
<input id="rateSlider" type="range" min="0.7" max="1.2" step="0.05" value="0.95">
<span id="rateShow">0.95</span>
<button id="toggleCnBtn">隐藏中文翻译</button>
<button id="randomBtn">🎲随机跳一句</button>
</div>
<div class="info-note">点击句子播放真人朗读，再点一次停止；当前句子会高亮并自动滚动</div>
</div>

<div id="listWrap"></div>
<audio id="player" preload="none"></audio>

let showCn = true;
let playIndex = -1;
let currentTab = "all";
let currentVoice = "aria";
const listWrap = document.querySelector("#listWrap");
const rateSlider = document.querySelector("#rateSlider");
const rateShow = document.querySelector("#rateShow");
const toggleCnBtn = document.querySelector("#toggleCnBtn");
const randomBtn = document.querySelector("#randomBtn");
const player = document.querySelector("#player");

// 默认音量增益 +30%（Web Audio 增益节点，支持超过 100%）
let audioCtx = null, gainReady = false;
function ensureAudioGain(){
    if(gainReady) return;
    try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaElementSource(player);
        const gain = audioCtx.createGain();
        gain.gain.value = 1.3; // +30%
        src.connect(gain).connect(audioCtx.destination);
        if(audioCtx.state === "suspended") audioCtx.resume();
        gainReady = true;
    }catch(e){ console.warn("音量增益初始化失败", e); }
}

function pad(n){ return String(n).padStart(4,"0"); }

//分类标签
document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.type;
        stopPlay();
        renderAll();
    };
});

//发音人切换
document.querySelectorAll(".voice-btn").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".voice-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentVoice = btn.dataset.voice;
        if(playIndex >= 0) playByIndex(playIndex); // 换人重读当前句
    };
});

function renderAll(){
    listWrap.innerHTML = "";
    let filterList = sentencePool;
    if(currentTab !== "all"){
        filterList = sentencePool.filter(s=>s.type === currentTab);
    }
    filterList.forEach((item)=>{
        const realIdx = sentencePool.indexOf(item);
        const div = document.createElement("div");
        div.className = "sentence-item";
        div.dataset.realIdx = realIdx;
        div.innerHTML =
            '<span class="spk">🔊</span>' +
            '<div><div class="en-line">'+item.en+'</div>' +
            '<div class="cn-line"'+(showCn?"":" style='display:none'")+'>'+item.cn+'</div></div>';
        div.onclick = ()=>{
            if(playIndex === realIdx && !player.paused){ stopPlay(); }
            else playByIndex(realIdx);
        };
        listWrap.appendChild(div);
    });
}

function playByIndex(idx){
    ensureAudioGain();
    playIndex = idx;
    updatePlayingHighlight();
    autoScroll(idx);
    player.src = "audio/" + currentVoice + "/" + pad(idx) + ".mp3";
    player.playbackRate = parseFloat(rateSlider.value);
    player.play().catch(err=>{
        console.warn("播放失败，请确认 audio 文件夹和网页在一起", err);
    });
}

function stopPlay(){
    player.pause();
    player.currentTime = 0;
    playIndex = -1;
    updatePlayingHighlight();
}

player.onended = ()=>{ playIndex = -1; updatePlayingHighlight(); };

function updatePlayingHighlight(){
    document.querySelectorAll(".sentence-item").forEach(el=>{
        if(Number(el.dataset.realIdx) === playIndex) el.classList.add("playing");
        else el.classList.remove("playing");
    });
}

function autoScroll(idx){
    const el = document.querySelector('.sentence-item[data-real-idx="'+idx+'"]');
    if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest", behavior:"smooth"});
}

rateSlider.oninput = ()=>{
    rateShow.innerText = rateSlider.value;
    player.playbackRate = parseFloat(rateSlider.value);
};

toggleCnBtn.onclick = ()=>{
    showCn = !showCn;
    toggleCnBtn.innerText = showCn ? "隐藏中文翻译" : "显示中文翻译";
    document.querySelectorAll(".cn-line").forEach(el=>{
        el.style.display = showCn ? "block" : "none";
    });
};

randomBtn.onclick = ()=>{
    let filterList = sentencePool;
    if(currentTab !== "all") filterList = sentencePool.filter(s=>s.type === currentTab);
    const item = filterList[Math.floor(Math.random()*filterList.length)];
    playByIndex(sentencePool.indexOf(item));
};

renderAll();
</script>
